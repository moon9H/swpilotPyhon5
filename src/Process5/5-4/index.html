    <h1>우주 해적</h1>
    <p>우주 해적은 우주를 타고 활동하는 해적 단체입니다. 우주선을 이용하여 다양한 행성과 우주 정거장을 공격하며 자원을 획득합니다.<br>
        우주해적(영어[1]: Space Pirate, 일본어[2]: 宇宙海賊うちゅうかいぞく, 독일어[3]: Raumpirat, Raumpiratin)은 <br>
        스페이스 오페라물에서 빠지지 않고 등장하는 세력으로 말 그대로 우주에서 우주선을 상대로 노략질하는 해적이다. 
    </p>
